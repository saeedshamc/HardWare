[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; کتابخانه‌های مورد نیاز
lib_deps = 
    ESP32 WebServer
    SPIFFS

; تنظیمات کامپایل
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; تنظیمات آپلود
upload_port = COM3
monitor_port = COM3
