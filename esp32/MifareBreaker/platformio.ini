; MifareBreaker — ESP32 + RC522 (sources live at project root)
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs

; Compile firmware modules only (skip tools/docs/scripts)
build_src_filter =
  +<main.cpp>
  +<hal/>
  +<core/>
  +<crypto/crypto1.cpp>
  +<attacks/>
  +<output/>
  +<storage/>
  +<ui/>

build_flags =
  -I.
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  me-no-dev/ESP Async WebServer@^1.2.3
  me-no-dev/AsyncTCP@^1.1.1
  bblanchon/ArduinoJson@^6.21.3
  adafruit/Adafruit SSD1306@^2.5.9
  adafruit/Adafruit GFX Library@^1.11.9
