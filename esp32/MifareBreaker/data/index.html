<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>MifareBreaker Dashboard</title>
<style>
body{font-family:system-ui,monospace;background:#0f1720;color:#cbd5e1;margin:0;padding:0}
#app{display:flex;height:100vh}
#left{width:220px;padding:12px;border-right:1px solid #102;}
#right{flex:1;padding:12px}
.tile{background:#111827;padding:8px;margin:6px;border-radius:6px}
.log{background:#0b1220;padding:8px;height:70vh;overflow:auto;border-radius:6px}
.button{background:#0b84ff;color:#fff;padding:6px 10px;border-radius:4px;border:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sector{background:#222;padding:8px;border-radius:4px;text-align:center}
.green{background:#064e3b}
.yellow{background:#92400e}
.red{background:#7f1d1d}
.gray{background:#374151}
</style>
</head>
<body>
<div id=app>
  <div id=left>
    <div class=tile><h3>MifareBreaker</h3><div id=info>Disconnected</div></div>
    <div class=tile><button class=button onclick="start('dictionary')">▶ Dictionary</button>
    <button class=button onclick="start('nested')">▶ Nested</button></div>
    <div class=tile><button class=button onclick="downloadDump()">⬇ Dump</button></div>
    <div class=tile><div class=grid id=sectors></div></div>
  </div>
  <div id=right>
    <div class=tile><h4>Live Log</h4><div id=log class=log></div></div>
  </div>
</div>
<script>
let ws;
function connect(){
  ws = new WebSocket('ws://'+location.host+'/ws');
  ws.onopen = ()=> log('[WS] connected');
  ws.onmessage = (m)=> {
    try{ let j=JSON.parse(m.data); handleEvent(j);}catch(e){ log('[raw] '+m.data); }
  };
  ws.onclose = ()=> setTimeout(connect,2000);
}
function log(s){ let el=document.getElementById('log'); el.innerText = s+"\n" + el.innerText; }
function handleEvent(e){ if(e.event==='card_detected'){ document.getElementById('info').innerText='UID:'+e.data.uid; buildGrid(e.data.sectors);} log(JSON.stringify(e)); }
function buildGrid(n){ let g=document.getElementById('sectors'); g.innerHTML=''; for(let i=0;i<n;i++){ let s=document.createElement('div'); s.className='sector gray'; s.innerText='S'+(i<10?'0':'')+i; g.appendChild(s);} }
function start(attack){ fetch('/api/attack',{method:'POST', body: JSON.stringify({attack:attack}), headers:{'Content-Type':'application/json'}}).then(r=>r.json()).then(j=>log('[api] '+JSON.stringify(j))); }
function downloadDump(){ window.location='/api/dump'; }
connect();
</script>
</body>
</html>
