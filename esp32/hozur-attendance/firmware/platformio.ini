; Hozur Attendance — ESP32 firmware
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
  miguelbalboa/MFRC522@^1.4.11
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.1
  adafruit/RTClib@^2.1.4

build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=4
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=27000000
  -DCORE_DEBUG_LEVEL=1

test_ignore =
  test_access_bits

[env:native]
platform = native
test_build_src = false
build_src_filter = +<*> -<main.cpp> -<rfid/> -<display/> -<ui/> -<net/> -<storage/>
build_flags =
  -DUNIT_TEST=1
